<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR 动作体感游戏大厅</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: white;
      font-family: 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 {
      font-size: 32px;
      color: #ffeb3b;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(255, 235, 59, 0.4);
    }
    p.subtitle {
      color: #b3e5fc;
      margin-bottom: 36px;
      font-size: 16px;
    }
    .grid {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px;
    }
    .game-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 28px;
      width: 320px;
      text-align: center;
      transition: transform 0.3s ease, border-color 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .game-card:hover {
      transform: translateY(-8px);
      border-color: #00e676;
    }
    .game-card .icon { font-size: 54px; margin-bottom: 16px; }
    .game-card h2 { font-size: 22px; color: #fff; margin-bottom: 10px; }
    .game-card p { font-size: 14px; color: #b0bec5; line-height: 1.5; margin-bottom: 20px; }
    .launch-btn {
      display: inline-block;
      background: linear-gradient(45deg, #00e676, #00b0ff);
      color: white;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 20px;
      font-size: 16px;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.4);
    }
  </style>
</head>
<body>
  <h1>🎮 AR 动作体感游戏大厅</h1>
  <p class="subtitle">请选择您要游玩的体感游戏项目：</p>

  <div class="grid">
    <div class="game-card">
      <div class="icon">🍎🍉</div>
      <h2>手势拍水果 AR</h2>
      <p>张开双臂面对摄像头，双掌拍击下落水果！带 3D 倒计时、BGM 与星级勋章。</p>
      <a href="./fruit/index.html" class="launch-btn">进入游戏</a>
    </div>

    <div class="game-card">
      <div class="icon">🏸🔥</div>
      <h2>双人羽毛球对战 AR</h2>
      <p>单摄像头横屏 16:9 对战，手挥流光球拍打出暴扣！含 4D 运动数据与 MVP 战报。</p>
      <a href="./badminton/index.html" class="launch-btn">进入对战</a>
    </div>

    <div class="game-card">
      <div class="icon">⚡🔥</div>
      <h2>超级赛亚人 AR 爆气</h2>
      <p>顺序手势突破极限变身！火焰金发、黄金爆气、战斗力飙升，双手推击发射龟派气功！</p>
      <a href="./saiyan/index.html" class="launch-btn">开始变身</a>
    </div>
  </div>
</body>
</html>
